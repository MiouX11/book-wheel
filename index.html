<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>简书 · 纯净高知学习社区</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    /* ===================== 主页深色玻璃拟态主题（青柠起始页风格） =====================
       仅作用于 .page-home.theme-dawn，不影响书库/人物/我的/登录等浅色页面 */
    .page-home.theme-dawn {
      --bg: #0f1216;
      --bg-soft: rgba(255,255,255,0.06);
      --card: rgba(255,255,255,0.08);
      --card-solid: rgba(28,32,38,0.72);
      --border: rgba(255,255,255,0.14);
      --border-soft: rgba(255,255,255,0.09);
      --text: #f5f7fa;
      --text-soft: rgba(245,247,250,0.82);
      --text-mute: rgba(245,247,250,0.55);
      --primary: #ff974f;          /* 青柠橙 */
      --primary-hover: #ff7a2f;
      --primary-soft: rgba(255,151,79,0.16);
      --accent: #337bf7;           /* 青柠蓝 */
      --shadow: 0 8px 40px rgba(0,0,0,0.35);
      --shadow-md: 0 12px 48px rgba(0,0,0,0.4);
      --shadow-lg: 0 24px 72px rgba(0,0,0,0.5);

      /* 背景图：山谷 + 深色遮罩 */
      background: linear-gradient(180deg, rgba(15,18,22,0.55) 0%, rgba(15,18,22,0.30) 30%, rgba(15,18,22,0.72) 100%),
                  linear-gradient(135deg, rgba(51,123,247,0.10), rgba(255,151,79,0.10)),
                  url("assets/img/hero-bg.jpg") center / cover no-repeat fixed,
                  #0f1216;
      background-blend-mode: normal;
    }

    /* 顶栏：毛玻璃 */
    .page-home.theme-dawn .topbar {
      background: rgba(15,18,22,0.42);
      backdrop-filter: blur(18px) saturate(160%);
      -webkit-backdrop-filter: blur(18px) saturate(160%);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 1px 0 rgba(255,255,255,0.04);
    }
    .page-home.theme-dawn .brand { color: #fff; }
    .page-home.theme-dawn .brand svg { color: var(--primary); }
    .page-home.theme-dawn .brand:hover { color: #fff; }
    .page-home.theme-dawn .nav-links a { color: var(--text-soft); }
    .page-home.theme-dawn .nav-links a.active,
    .page-home.theme-dawn .nav-links a:hover { color: var(--primary); }

    /* Hero：白字 */
    .page-home.theme-dawn .picker-main {
      max-width: 860px;
      padding-top: clamp(72px, 14vh, 140px);
    }
    .page-home.theme-dawn .picker-title {
      color: #fff;
      text-shadow: 0 2px 24px rgba(0,0,0,0.45);
    }
    .page-home.theme-dawn .picker-sub { color: rgba(245,247,250,0.85); text-shadow: 0 1px 14px rgba(0,0,0,0.5); }

    /* 类目：纯文字 */
    .page-home.theme-dawn .cat-link { color: rgba(245,247,250,0.62); }
    .page-home.theme-dawn .cat-link:hover { color: var(--primary); }
    .page-home.theme-dawn .cat-sep { color: rgba(245,247,250,0.45); }

    /* 主按钮 */
    .page-home.theme-dawn .pick-btn {
      background: var(--primary);
      box-shadow: 0 6px 22px rgba(255,120,47,0.35);
    }
    .page-home.theme-dawn .pick-btn:hover {
      background: var(--primary-hover);
      box-shadow: 0 10px 30px rgba(255,120,47,0.45);
    }
    .page-home.theme-dawn .picker-status { color: rgba(245,247,250,0.75); text-shadow: 0 1px 12px rgba(0,0,0,0.5); }
  </style>
</head>
<body class="page-home theme-dawn">
  <nav class="topbar">
    <a href="index.html" class="brand"><svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6c-1.9-1.4-4.3-1.8-8-1.4v13.2c3.7-.4 6.1 0 8 1.4 1.9-1.4 4.3-1.8 8-1.4V4.6c-3.7-.4-6.1 0-8 1.4z" fill="currentColor"/><path d="M12 6v13.2" stroke="var(--bg)" stroke-width="1.6"/></svg>简书<span class="brand-tag">纯净高知学习社区</span></a>
    <div class="nav-links">
      <a href="index.html" class="active">首页</a>
      <a href="community.html">社区</a>
      <a href="library.html">书库</a>
      <a href="people.html">人物</a>
      <a href="my.html">我的</a>
      <a href="login.html" id="nav-auth">登录</a>
    </div>
  </nav>

  <main class="picker-main">
    <div class="hero">
      <h1 class="picker-title">今天，想来学点什么？</h1>
      <p class="picker-sub">选一个方向，或直接随机来一本。先看一个问题，再读精炼全文。</p>
    </div>

    <div id="cat-chips" class="cat-chips" role="list" aria-label="类别"></div>

    <button id="pick-btn" class="pick-btn">随机来一本</button>

    <p id="picker-status" class="picker-status" aria-live="polite"></p>
  </main>

  <script src="assets/js/supabase-config.js"></script>
  <script src="assets/vendor/supabase.min.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/icons.js"></script>
<script src="assets/js/data.js"></script>
    <script src="assets/js/reads.js"></script>
  <script src="assets/js/picker.js"></script>
  <script>
    window.Auth?.onChange((user) => {
      const link = document.getElementById("nav-auth");
      if (!link) return;
      if (user) {
        link.textContent = (user.email || "").split("@")[0] || "已登录";
        link.href = "my.html";
      } else {
        link.textContent = "登录";
        link.href = "login.html";
      }
    });
  </script>
</body>
</html>
