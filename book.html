<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>精读一本书 · 简书</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="page-book">
  <div id="reading-progress"></div>

  <nav class="topbar">
    <a href="index.html" class="brand"><svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6c-1.9-1.4-4.3-1.8-8-1.4v13.2c3.7-.4 6.1 0 8 1.4 1.9-1.4 4.3-1.8 8-1.4V4.6c-3.7-.4-6.1 0-8 1.4z" fill="currentColor"/><path d="M12 6v13.2" stroke="var(--bg)" stroke-width="1.6"/></svg>简书</a>
    <div class="nav-links">
      <a href="index.html">首页</a>
      <a href="community.html">社区</a>
      <a href="library.html">书库</a>
      <a href="people.html">人物</a>
      <a href="my.html">我的</a>
      <a href="login.html" id="nav-auth">登录</a>
    </div>
  </nav>

  <main id="book-main" class="book-main">
    <p class="loading">加载中……</p>
  </main>

  <div id="reflect-mount" class="book-main reflect-mount"></div>

  <script src="assets/js/supabase-config.js"></script>
  <script src="assets/vendor/supabase.min.js"></script>
  <script src="assets/vendor/marked.min.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/icons.js"></script>
<script src="assets/js/data.js"></script>
  <script src="assets/js/distilled-data.js"></script>
  <script src="assets/js/reads.js"></script>
  <script src="assets/js/cover.js"></script>
  <script src="assets/js/reflections.js"></script>
  <script src="assets/js/book.js"></script>
  <script src="assets/js/book-reflect.js"></script>
  <script>
    window.Auth?.onChange((user) => {
      const link = document.getElementById("nav-auth");
      if (!link) return;
      if (user) {
        link.textContent = (user.email || "").split("@")[0] || "已登录";
        link.href = "my.html";
      } else {
        link.textContent = "登录";
        link.href = "login.html";
      }
    });
  </script>
</body>
</html>
